<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote to Paid: logo options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f5f3ee; --surface:#fff; --line:#d9d4c9; --ink:#15201e; --muted:#59635f; --brand:#0e5c57; --sun:#f2a541; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 "Public Sans", system-ui, sans-serif; padding:32px 16px 64px; }
  h1, h2 { font-family:"Bricolage Grotesque", sans-serif; letter-spacing:-0.01em; }
  main { max-width:1100px; margin:0 auto; }
  .opt { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:24px; margin-top:24px; }
  .row { display:flex; flex-wrap:wrap; gap:20px; align-items:center; margin-top:16px; }
  .logo { display:flex; align-items:center; gap:10px; padding:18px 22px; border-radius:14px; font:600 22px "Bricolage Grotesque", sans-serif; }
  .light { background:var(--paper); }
  .dark { background:var(--ink); color:var(--paper); }
  .tab { display:flex; align-items:center; gap:8px; background:#dee1e6; border-radius:10px 10px 0 0; padding:8px 14px; font-size:13px; width:230px; }
  .card { width:320px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; font-size:13px; }
  .card .img { height:160px; background:var(--paper); display:flex; flex-direction:column; justify-content:center; padding:18px; gap:8px; }
  .card .img b { font:600 22px/1.05 "Bricolage Grotesque", sans-serif; }
  .card .meta { padding:10px 12px; background:#f0f2f5; }
  .label { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Quote to Paid: logo options</h1>
  <p class="label">Pick one. It goes in DESIGN.md, and the app's icon, home-screen icon and link preview are drawn from it. Option A is in the app now.</p>
  <div id="opts"></div>
</main>
<template id="t">
  <section class="opt">
    <h2 class="name"></h2>
    <p class="why label"></p>
    <div class="row">
      <div class="logo light"><span class="m" data-s="34"></span>Quote to Paid</div>
      <div class="logo dark"><span class="m" data-s="34" data-dark></span>Quote to Paid</div>
    </div>
    <div class="row">
      <div><div class="tab"><span class="m" data-s="16"></span>Quote to Paid · No quote…</div><p class="label">Favicon, 16 px</p></div>
      <div><div class="tab"><span class="m" data-s="32"></span>Quote to Paid</div><p class="label">32 px</p></div>
      <div><span class="m" data-s="72" data-r="16"></span><p class="label">Home-screen icon</p></div>
      <div class="card"><div class="img"><span class="m" data-s="30"></span><b>No quote or invoice goes quiet.</b></div><div class="meta"><strong>Quote to Paid · No quote or invoice goes quiet</strong><br>Follows up on every quote and unpaid invoice…</div></div>
    </div>
  </section>
</template>
<script>
  const marks = {
    A: { name: "A · Text with a check", why: "A message bubble with a check: the follow-up that got its answer. Teal and sun.",
      svg: (dark) => `<rect width="32" height="32" rx="8" fill="#0e5c57"/><path d="M9 9.5h14a2.5 2.5 0 0 1 2.5 2.5v7a2.5 2.5 0 0 1-2.5 2.5h-6.5L12 25v-3.5H9A2.5 2.5 0 0 1 6.5 19v-7A2.5 2.5 0 0 1 9 9.5z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M11.8 15.6l2.8 2.8 5.6-5.6" fill="none" stroke="#f2a541" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>` },
    B: { name: "B · The loop", why: "An arrow that comes back around to a dollar dot: quote out, money back.",
      svg: (dark) => `<rect width="32" height="32" rx="16" fill="#0e5c57"/><path d="M22.5 11.5A8 8 0 1 0 24 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M19.5 11.2h3.4V7.8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="16" r="3.2" fill="#f2a541"/>` },
    C: { name: "C · Paid slip", why: "An invoice slip with a check across it. Plain and literal; reads well tiny.",
      svg: (dark) => `<rect width="32" height="32" rx="8" fill="${dark ? '#f2a541' : '#15201e'}"/><path d="M10 7h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z" fill="#f5f3ee"/><path d="M12.5 16l2.5 2.5 4.5-5" fill="none" stroke="#0e5c57" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>` },
  };
  const host = document.getElementById("opts");
  for (const k of Object.keys(marks)) {
    const node = document.getElementById("t").content.cloneNode(true);
    node.querySelector(".name").textContent = marks[k].name;
    node.querySelector(".why").textContent = marks[k].why;
    node.querySelectorAll(".m").forEach((el) => {
      const s = el.dataset.s;
      el.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 32 32" style="display:block">${marks[k].svg(el.hasAttribute("data-dark"))}</svg>`;
    });
    host.appendChild(node);
  }
</script>
</body>
</html>
